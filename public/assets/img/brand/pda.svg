<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="pdaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#015095" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- Outer circle background -->
  <circle cx="80" cy="80" r="74" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
  <circle cx="80" cy="80" r="66" fill="none" stroke="#015095" stroke-width="2.5" />
  
  <!-- Orbital Arc -->
  <path d="M 30 75 A 52 24 0 1 1 130 85 A 52 24 0 1 1 30 75" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="128" cy="72" r="5" fill="#10B981" />

  <!-- Bold Text PDA -->
  <text x="80" y="88" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#015095" text-anchor="middle" letter-spacing="1">PDA</text>
  
  <!-- Subtitle -->
  <text x="80" y="115" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#0284C7" text-anchor="middle" letter-spacing="2">MEMBER</text>
</svg>
